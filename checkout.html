<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="google-site-verification" content="31b3489206a8990a" />
<title>Checkout — AZ COASTAL</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#FFFBF8;--black:#101828;--gold:#C8A46A;--ocean:#1E3A5F;--line:#F0E6E0}
*{box-sizing:border-box}
body{font-family:'Poppins',sans-serif;margin:0;background:var(--bg);color:var(--black)}
h1,h2{font-family:'Playfair Display',serif}
header{position:sticky;top:0;z-index:100;background:rgba(255,255,255,0.92);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);padding:12px 20px;display:flex;justify-content:space-between;align-items:center}
.logo{font-weight:800;font-size:18px;letter-spacing:2px;font-family:'Playfair Display'} .logo small{display:block;font-family:'Poppins';font-size:9px;letter-spacing:3px;color:var(--gold);font-weight:500}
.header-actions{display:flex;gap:8px;align-items:center}
.call-btn{background:white;border:1px solid var(--line);color:var(--black);padding:9px 14px;border-radius:999px;text-decoration:none;font-weight:700;font-size:12px}
.back{background:var(--black);color:white;padding:9px 14px;border-radius:999px;text-decoration:none;font-weight:700;font-size:12px}
.wrap{max-width:1000px;margin:0 auto;padding:26px 18px;display:grid;grid-template-columns:1.1fr 0.9fr;gap:22px}
.card{background:white;border:1px solid var(--line);border-radius:24px;padding:20px;box-shadow:0 12px 30px rgba(0,0,0,0.04)}
.cart-item{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);align-items:center}
.input{width:100%;padding:13px 14px;margin:8px 0;border:1px solid var(--line);border-radius:12px;font-size:13px;background:#FFFBF9;outline:none;font-family:'Poppins'}
.btn{width:100%;padding:15px;border:none;border-radius:999px;font-weight:800;letter-spacing:.8px;font-size:13px;cursor:pointer;margin-top:10px}
.btn-pay{background:var(--black);color:white}
.btn-pay:hover{background:#000}
.btn-wa{background:#25D366;color:white}
.summary-line{display:flex;justify-content:space-between;margin:8px 0;font-size:13px;color:#667085}
.summary-line.total{font-weight:800;color:var(--black);font-size:16px;border-top:1px solid var(--line);padding-top:12px;margin-top:12px}
@media(max-width:860px){.wrap{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
  <div class="logo">AZ COASTAL<small>STYLE THAT SPEAKS</small></div>
  <div class="header-actions">
    <a href="tel:+27712521290" class="call-btn">📞 071 252 1290</a>
    <a href="index.html" class="back">← Shop</a>
  </div>
</header>

<div style="text-align:center;padding:22px 18px 0">
  <h1 style="margin:0;font-size:34px">Checkout</h1>
  <p style="color:#667085;font-size:13px">Payfast secure • She gets email instantly</p>
</div>

<div class="wrap">
  <div class="card">
    <h2 style="margin:0 0 14px">Your Order <span id="count" style="color:var(--gold)">(0)</span></h2>
    <div id="cartItems"></div>
    <div id="summary" style="margin-top:16px"></div>
  </div>

  <div class="card">
    <h2 style="margin:0 0 14px">Delivery Details</h2>
    <input type="text" id="name" class="input" placeholder="Full Name" required>
    <input type="email" id="email" class="input" placeholder="Your Email — for receipt" required>
    <input type="tel" id="phone" class="input" placeholder="WhatsApp — 071..." required>
    <input type="text" id="city" class="input" placeholder="City — e.g. Durban" required>
    <textarea id="address" class="input" placeholder="Full Address" rows="3" required></textarea>
    <select id="delivery" class="input">
      <option value="Delivery">Delivery — R80 (Free over R800)</option>
      <option value="Collection">Collection — Free</option>
    </select>
    <textarea id="note" class="input" placeholder="Note / Card message" rows="2"></textarea>

    <button class="btn btn-pay" onclick="payWithPayfast()">💳 Pay Online with Payfast</button>
    <button class="btn btn-wa" onclick="sendWhatsApp()">💬 Pay on Delivery — WhatsApp</button>
    <p style="font-size:11px;color:#98A2B3;text-align:center;margin-top:10px">Payfast will email AZ COASTAL (071 252 1290) + you get receipt • Secure</p>
  </div>
</div>

<!-- HIDDEN PAYFAST FORM -->
<form id="payfastForm" action="https://www.payfast.co.za/eng/process" method="post" style="display:none">
  <input type="hidden" name="merchant_id" id="pf_merchant_id">
  <input type="hidden" name="merchant_key" id="pf_merchant_key">
  <input type="hidden" name="return_url" id="pf_return_url">
  <input type="hidden" name="cancel_url" id="pf_cancel_url">
  <input type="hidden" name="notify_url" id="pf_notify_url">
  <input type="hidden" name="amount" id="pf_amount">
  <input type="hidden" name="item_name" id="pf_item_name">
  <input type="hidden" name="item_description" id="pf_item_description">
  <input type="hidden" name="email_address" id="pf_email">
  <input type="hidden" name="custom_str1" id="pf_custom1">
  <input type="hidden" name="custom_str2" id="pf_custom2">
</form>

<script>
// ===== CONFIG — CHANGE HERE =====
let businessEmail = "azcoastal@gmail.com"; // where order email goes
let whatsappNumber = "27712521290";
// GET THESE FROM PAYFAST DASHBOARD -> Settings -> Integration
let pf_merchant_id = "10000100"; // TEST ID - replace with hers
let pf_merchant_key = "46f0cd694581a"; // TEST KEY - replace with hers
// ================================

let cart = JSON.parse(localStorage.getItem('cart')) || [];
function parsePrice(p){ return parseInt(p.replace(/[^\d]/g,''))||0 }

function loadCart(){
  let div=document.getElementById('cartItems');
  let summary=document.getElementById('summary');
  div.innerHTML="";
  if(cart.length===0){
    div.innerHTML="<div style='text-align:center;padding:20px;color:#667085'>Bag empty 🌊<br><a href='index.html' style='color:var(--ocean);font-weight:700'>Go shopping</a></div>";
    summary.innerHTML=""; document.getElementById('count').innerText="(0)"; return;
  }
  let subtotal=0;
  cart.forEach((item,i)=>{
    subtotal+=parsePrice(item.price);
    div.innerHTML+=`<div class="cart-item"><div style="width:58px;height:58px;border-radius:12px;background:#FFF4F0;display:flex;align-items:center;justify-content:center">${item.name.includes('Bouquet')?'💐':'👗'}</div><div style="flex:1"><b style="font-size:13px">${item.name}</b><p style="margin:2px 0 0;font-size:11px;color:#667085">${item.price} • ${item.size} • ${item.color}</p></div><button onclick="removeItem(${i})" style="border:none;background:#FFF0F0;color:#C0392B;padding:6px 10px;border-radius:999px;font-size:11px;font-weight:700;cursor:pointer">X</button></div>`;
  });
  let deliveryFee = subtotal>=800 ? 0 : 80;
  let total = subtotal + deliveryFee;
  document.getElementById('count').innerText=`(${cart.length})`;
  summary.innerHTML=`<div class="summary-line"><span>Subtotal</span><span>R${subtotal}</span></div><div class="summary-line"><span>Delivery</span><span>${deliveryFee===0?'<b style=color:#1E3A5F>FREE</b>':'R'+deliveryFee}</span></div><div class="summary-line total"><span>Total</span><span>R${total}</span></div>`;
  summary.dataset.subtotal=subtotal; summary.dataset.delivery=deliveryFee; summary.dataset.total=total;
}
function removeItem(i){ cart.splice(i,1); localStorage.setItem('cart',JSON.stringify(cart)); loadCart(); }

function getFormData(){
  return {
    name: document.getElementById('name').value.trim(),
    email: document.getElementById('email').value.trim(),
    phone: document.getElementById('phone').value.trim(),
    city: document.getElementById('city').value.trim(),
    address: document.getElementById('address').value.trim(),
    delivery: document.getElementById('delivery').value,
    note: document.getElementById('note').value.trim(),
  }
}
function buildOrderText(data, subtotal, deliveryFee, total){
  let txt = `AZ COASTAL - NEW ORDER (Payfast)\n\nName: ${data.name}\nEmail: ${data.email}\nPhone: ${data.phone}\nCity: ${data.city}\nAddress: ${data.address}\nMethod: ${data.delivery}\nNote: ${data.note}\n\nORDER:\n`;
  cart.forEach((item,i)=>{ txt += `${i+1}. ${item.name} - ${item.price} (${item.size} | ${item.color})\n`; });
  txt += `\nSubtotal: R${subtotal}\nDelivery: ${deliveryFee==0?'FREE':'R'+deliveryFee}\nTOTAL: R${total}\n`;
  return txt;
}

async function sendEmailToOwner(orderText, customerEmail){
  try{
    await fetch(`https://formsubmit.co/ajax/${businessEmail}`, {
      method: "POST",
      headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
      body: JSON.stringify({
        subject: `NEW ORDER PAID - AZ COASTAL - R${document.querySelector('#summary').dataset.total}`,
        message: orderText,
        _cc: customerEmail,
        _template: "table",
        _captcha: "false"
      })
    });
  }catch(e){ console.log(e); }
}

async function payWithPayfast(){
  let data = getFormData();
  if(!data.name||!data.email||!data.phone||!data.city||!data.address){ alert("Please fill Name, Email, Phone, City, Address"); return; }
  if(cart.length===0){ alert("Cart empty"); return; }

  let sub = document.querySelector('#summary');
  let subtotal = sub.dataset.subtotal;
  let deliveryFee = sub.dataset.delivery;
  let total = sub.dataset.total;
  let orderText = buildOrderText(data, subtotal, deliveryFee, total);

  // 1. Send email to her BEFORE redirecting to Payfast
  await sendEmailToOwner(`PAYMENT INITIATED via Payfast\n\n${orderText}`, data.email);

  // 2. Fill Payfast form
  let siteUrl = window.location.origin;
  document.getElementById('pf_merchant_id').value = pf_merchant_id;
  document.getElementById('pf_merchant_key').value = pf_merchant_key;
  document.getElementById('pf_return_url').value = siteUrl + "/success.html";
  document.getElementById('pf_cancel_url').value = siteUrl + "/checkout.html";
  document.getElementById('pf_notify_url').value = siteUrl + "/success.html";
  document.getElementById('pf_amount').value = total;
  document.getElementById('pf_item_name').value = "AZ COASTAL Order";
  document.getElementById('pf_item_description').value = orderText.substring(0,255);
  document.getElementById('pf_email').value = data.email;
  document.getElementById('pf_custom1').value = data.name + " | " + data.phone;
  document.getElementById('pf_custom2').value = data.address + ", " + data.city;

  // 3. Save order for success page and redirect to Payfast
  localStorage.setItem('last_order', orderText);
  document.getElementById('payfastForm').submit();
}

function sendWhatsApp(){
  let data = getFormData();
  if(!data.name||!data.phone||!data.city||!data.address){ alert("Fill details"); return; }
  let sub = document.querySelector('#summary');
  let orderText = buildOrderText(data, sub.dataset.subtotal, sub.dataset.delivery, sub.dataset.total);
  window.open(`https://wa.me/${whatsappNumber}?text=${encodeURIComponent(orderText)}`,'_blank');
  localStorage.removeItem('cart'); cart=[]; loadCart();
}

loadCart();
</script>
</body>
</html>
